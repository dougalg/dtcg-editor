packages:
  - "packages/*"
  - "apps/*"

catalogMode: strict
cleanupUnusedCatalogs: true

catalog:
  typescript: ^7.0.2
  neverthrow: ^8.2.0
  react: 19.3.0
  react-dom: 19.3.0
  zod: ^4.6.1
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  '@ls-lint/ls-lint': ^2.3.1
  '@commitlint/cz-commitlint': ^21.2.2
  inquirer: ^14.2.2
  '@biomejs/biome': 2.5.12
  vitest: ^5.0.0
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.0.1
  '@testing-library/react': ^16.3.3
  '@vitest/browser': ^5.0.0
  '@vitest/browser-playwright': ^5.0.0
  axe-core: ^4.13.0
  '@types/react-dom': ^19.3.0
  '@storybook/react-vite': 10.6.0
  storybook: 10.6.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': ^10.6.0
  next: 16.3.4
  '@dtcg-editor/token-editor-cubic-bezier': workspace:*
  '@dtcg-editor/design-system': workspace:*
  '@dtcg-editor/token-core': workspace:*
  '@dtcg-editor/token-editor-contract': workspace:*
  '@dtcg-editor/token-editor-font-family': workspace:*
  '@dtcg-editor/token-editor-color': workspace:*
  '@dtcg-editor/token-editor-dimension': workspace:*
  '@dtcg-editor/token-editor-stroke-style': workspace:*
  '@dtcg-editor/token-editor-border': workspace:*
  '@dtcg-editor/token-editor-duration': workspace:*
  '@dtcg-editor/token-editor-transition': workspace:*
  '@dtcg-editor/token-editor-number': workspace:*
  '@dtcg-editor/token-editor-font-weight': workspace:*
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

update:
  githubActions: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - tmp@0.2.4 || 0.2.6
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
  - brace-expansion@5.0.8
  - nanoid@3.3.18

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
