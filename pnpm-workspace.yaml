packages:
  - "packages/*"
  - "apps/*"

catalogMode: strict
cleanupUnusedCatalogs: true

catalog:
  typescript: ^7.0.2
  neverthrow: ^8.2.0
  react: 19.2.8
  react-dom: 19.2.8
  zod: ^4.4.3
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  '@ls-lint/ls-lint': ^2.3.1
  '@commitlint/cz-commitlint': ^21.2.2
  inquirer: ^14.0.2

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - tmp@0.2.4 || 0.2.6
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
  - brace-expansion@5.0.8
  - nanoid@3.3.18

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
