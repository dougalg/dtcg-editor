ls:
  # React component filename/folder conventions (specs/003-component-file-lint).
  #
  # Every real "components" directory in the repo (apps/web-app/components,
  # plus every packages/*/src/components) shares identical rules, combined
  # here via ls-lint's brace-expansion glob syntax ("{a,b}") — verified this
  # actually works (both indexes and enforces) against the installed binary
  # before relying on it. Deliberately "packages/*/src/components", not a
  # "**/components" recursive glob: verified hands-on that `**` combined with
  # an `ignore:` entry produces PHANTOM violations for the ignored path
  # (ls-lint's glob rule-matching runs independently of the ignore-filtered
  # file walk, so an ignored-but-glob-matched directory like a package's
  # dist/src/components/ build-output mirror gets indexed as "expected files,
  # found 0" even though it's correctly skipped during the actual scan). The
  # narrower "packages/*/src/components" pattern sidesteps this entirely: it
  # structurally can never match packages/*/dist/src/components (the segment
  # right after packages/* must literally be "src"), so no ignore entry is
  # needed for it at all — confirmed empirically, not assumed.
  #
  # Each location needs a bare directory key (forbids stray .tsx files sitting
  # flat, outside any per-component folder) plus a `/*` glob key (enforces the
  # per-component folder's own rules) — required because ls-lint's `/*` glob
  # only matches directories that already exist one level down; a flat file
  # sitting directly in the parent is otherwise invisible to it. `.dir:
  # PascalCase` and `.tsx: regex:${0}` are kept as separate rules (not
  # combined with `|`) because `|` is a logical OR across the rules it joins,
  # not AND — combining them would let a PascalCase-but-wrongly-placed file
  # (or vice versa) silently pass. `regex:${0}` alone already forces the
  # file's basename to exactly equal its (PascalCase-enforced) folder name, so
  # no separate PascalCase rule is needed on the .tsx key itself.
  "{apps/web-app/components,packages/*/src/components}":
    .tsx: exists:0
  "{apps/web-app/components,packages/*/src/components}/*":
    .dir: PascalCase
    .tsx: regex:${0} | exists:1

  # Naming-only conventions (no folder-per-file requirement) confirmed by
  # direct inspection to already match every existing file in both locations.
  apps/web-app/hooks:
    .ts: camelCase
    .tsx: camelCase
  apps/web-app/lib/**:
    .ts: kebab-case
    .tsx: kebab-case

ignore:
  - node_modules
  - dist
  - .next
  - coverage
  - out
  - build
  - apps/web-app/app
